# The free test's dead-man's switch (2026-10-25). Every 15 minutes, from outside the
# Mac mini, ask the site whether the engine's heartbeat is fresh; the site emails
# Brian once when it has been silent 20 minutes, and once more when it's back
# (app/api/free-test/watch/route.ts). A GitHub schedule because Vercel's Hobby plan
# allows a cron at most once a day. GitHub may start a scheduled run a few minutes
# late, which the 20-minute threshold allows for.
#
# Needs the repository secret CRON_SECRET, the same value as Vercel's CRON_SECRET.
# Until it is set the run says so and passes, so nothing fails every 15 minutes.
name: Free test watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl -fsS --retry 2 --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
            https://brianbeals.com/api/free-test/watch
