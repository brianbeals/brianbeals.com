name: Publish essay 3 on June 13

# Scheduled merge of the essay-03-an-llm-with-a-logo branch into main.
# Runs once on June 13, 2026 at 13:00 UTC (9:00 AM ET, EDT).
# Self-destructs in the same commit so it won't fire next year.
# GitHub Actions cron is best-effort; may fire 0-15 minutes late under load.
# workflow_dispatch allows manual firing from the Actions tab.

on:
  schedule:
    - cron: '0 13 13 6 *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge essay branch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin essay-03-an-llm-with-a-logo
          git merge origin/essay-03-an-llm-with-a-logo --no-ff --no-commit
          git rm .github/workflows/publish-essay-03.yml
          git commit -m "Publish: An LLM With a Logo (remove scheduled-publish workflow)"
          git push origin main
