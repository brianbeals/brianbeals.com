name: Publish essay 4 on June 27

# Scheduled merge of the essay-04-how-i-review-my-own-writing branch into main.
# Runs once on June 27, 2026 at 13:00 UTC (9:00 AM ET, EDT).
# Self-destructs in the same commit so it won't fire next year.
# GitHub Actions cron is best-effort; may fire 0-15 minutes late under load.
# workflow_dispatch allows manual firing from the Actions tab.

on:
  schedule:
    - cron: '0 13 27 6 *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge essay branch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin essay-04-how-i-review-my-own-writing
          git merge origin/essay-04-how-i-review-my-own-writing --no-ff --no-commit
          git rm .github/workflows/publish-essay-04.yml
          git commit -m "Publish: How I Review My Own Writing (remove scheduled-publish workflow)"
          git push origin main
