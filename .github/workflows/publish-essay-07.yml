name: Publish essay 7 on August 22

# Scheduled merge of the essay-07-i-built-the-thing branch into main.
# Runs once on August 22, 2026 at 12:17 UTC (8:17 AM ET, EDT).
# Self-destructs in the same commit so it won't fire next year.
#
# WHY 8:17 AND NOT 9:17. Essay 6 was scheduled at 13:17 UTC and the publish commit
# landed at 13:57:55 UTC, roughly 40 minutes late. Its LinkedIn post fired at 14:00 UTC
# and hard-links the page, so that run had about two minutes of margin. GitHub Actions
# cron is best-effort and the documented drift is 0-15 minutes; the observed drift was
# far worse. Moving the site publish an hour earlier turns a 2-minute margin into
# roughly 1h40m.
#
# The :17 is also deliberate. Essay 8 sat at the top of the hour ('0 13 25 7 *') and
# GitHub dropped the run entirely, which forced a manual workflow_dispatch. Stay off
# the hour.
#
# workflow_dispatch allows manual firing from the Actions tab if the cron is dropped.

on:
  schedule:
    - cron: '17 12 22 8 *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge essay branch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin essay-07-i-built-the-thing
          git merge origin/essay-07-i-built-the-thing --no-ff --no-commit
          git rm .github/workflows/publish-essay-07.yml
          git commit -m "Publish: I Built the Thing (remove scheduled-publish workflow)"
          git push origin main
