name: Publish essay 10 on September 19

# Scheduled merge of the essay-10-everybody-got-a-license branch into main.
# Runs once on September 19, 2026 at 13:07 UTC (9:07 AM ET, EDT).
#
# WHY :07 AND NOT :00. Essay 6's cron was set to '0 13 25 7 *' and GitHub dropped it
# entirely; top of the hour is the heaviest scheduling window on Actions and jobs there
# are the first to be shed under load. That publish had to be fired by hand from the
# Actions tab. Scheduling a few minutes past the hour stays inside "9ish" and steps out
# of the stampede.
#
# GitHub Actions cron is best-effort and may fire 0-15 minutes late under load.
# workflow_dispatch allows manual firing from the Actions tab if the cron is dropped.
#
# This file deletes itself on publish: the essay branch carries the `git rm` of this
# workflow, so merging the branch removes the scheduler along with it. Nothing to clean
# up afterwards, and nothing left behind to fire twice.

on:
  schedule:
    - cron: '7 13 19 9 *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge essay branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin essay-10-everybody-got-a-license
          git merge origin/essay-10-everybody-got-a-license --no-ff \
            -m "Publish: Everybody Got a License"
          git push origin main
