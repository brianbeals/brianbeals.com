name: Publish essay 11 on October 3

# Scheduled merge of the essay-11-who-could-afford-to-find-out branch into main.
# Runs once on October 3, 2026 at 13:07 UTC (9:07 AM ET, EDT).
#
# Seven minutes past the hour on purpose: essay 6's top-of-hour cron was dropped outright by
# GitHub. Essay 10's cron at :07 still fired 3h16m late on September 19, so the offset is not a
# guarantee, only a mitigation. workflow_dispatch is armed as the manual fallback and the live-URL
# monitor fires at 9:30 if the page is not up.
#
# GitHub Actions cron is best-effort and may fire late or not at all under load.
#
# This file deletes itself on publish: the essay branch carries the `git rm` of this workflow,
# so merging the branch removes the scheduler along with it. The routine is documented in
# README.md under "Publishing an essay on a schedule."

on:
  schedule:
    - cron: '7 13 3 10 *'    # 9:07 AM ET, primary
    - cron: '37 13 3 10 *'   # 9:37 AM ET, backup if the first is dropped. The merge is
                              # idempotent: if the first already ran, this one is a no-op.
  workflow_dispatch:          # the reliable path. Dispatched runs are not deprioritized the way
                              # scheduled runs are; drive this from n8n on the Mac mini.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge essay branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin essay-11-who-could-afford-to-find-out
          git merge origin/essay-11-who-could-afford-to-find-out --no-ff \
            -m "Publish: Who Could Afford to Find Out"
          git push origin main
