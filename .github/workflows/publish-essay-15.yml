name: Publish essay 15 on October 18

# Scheduled merge of the essay-15-the-form-that-sets-the-price branch into main.
# Runs once on Sunday, October 18, 2026 at 13:07 UTC (9:07 AM ET, EDT). Moved from Monday,
# October 19 on 2026-10-16.
#
# Seven minutes past the hour on purpose: essay 6's top-of-hour cron was dropped outright by
# GitHub. Essay 10's cron at :07 still fired 3h16m late on September 19, so the offset is not a
# guarantee, only a mitigation. workflow_dispatch is armed as the manual fallback. This is a Sunday
# slot, and the n8n essay dispatcher only runs Saturdays, so nothing dispatches it automatically:
# if the page is not up by 10:00, run `gh workflow run publish-essay-15.yml -R brianbeals/brianbeals.com`.
#
# GitHub Actions cron is best-effort and may fire late or not at all under load.
#
# This file deletes itself on publish: the essay branch carries the `git rm` of this workflow,
# so merging the branch removes the scheduler along with it. The routine is documented in
# README.md under "Publishing an essay on a schedule."

on:
  schedule:
    - cron: '7 13 18 10 *'    # 9:07 AM ET, primary
    - cron: '37 13 18 10 *'   # 9:37 AM ET, backup if the first is dropped. The merge is
                              # idempotent: if the first already ran, this one is a no-op.
  workflow_dispatch:          # the reliable path. Dispatched runs are not deprioritized the way
                              # scheduled runs are. Fire it by hand if the crons miss.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge essay branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin essay-15-the-form-that-sets-the-price
          git merge origin/essay-15-the-form-that-sets-the-price --no-ff \
            -m "Publish: The Form That Sets the Price"
          git push origin main
